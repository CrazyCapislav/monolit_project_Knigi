# Использование BuildKit для ускорения сборки
# Установите переменные окружения:
# export DOCKER_BUILDKIT=1
# export COMPOSE_DOCKER_CLI_BUILD=1

services:
  # ВАЖНО: Для production рекомендуется использовать отдельные PostgreSQL инстансы для каждого сервиса
  # Это обеспечивает изоляцию данных и независимое масштабирование
  # Для разработки допустимо использовать один PostgreSQL с разными БД
  postgres:
    image: postgres:16-alpine
    container_name: bookswap-postgres
    environment:
      POSTGRES_USER: bookswap
      POSTGRES_PASSWORD: bookswap
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bookswap-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookswap"]
      interval: 5s
      timeout: 5s
      retries: 5

  eureka-server:
    build:
      context: .
      args:
        SERVICE_NAME: eureka-server
      cache_from:
        - bookswap-eureka:latest
    image: bookswap-eureka:latest
    container_name: bookswap-eureka
    ports:
      - "${EUREKA_PORT:-8761}:${EUREKA_PORT:-8761}"
    environment:
      SERVER_PORT: ${EUREKA_PORT:-8761}
    networks:
      - bookswap-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  config-server:
    build:
      context: .
      args:
        SERVICE_NAME: config-server
      cache_from:
        - bookswap-config:latest
    image: bookswap-config:latest
    container_name: bookswap-config
    ports:
      - "${CONFIG_SERVER_PORT:-8888}:${CONFIG_SERVER_PORT:-8888}"
    environment:
      SERVER_PORT: ${CONFIG_SERVER_PORT:-8888}
      EUREKA_URI: http://eureka-server:${EUREKA_PORT:-8761}/eureka/
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - bookswap-network
    healthcheck:
      # Используется внутренний порт контейнера (SERVER_PORT), по умолчанию 8888
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  gateway:
    build:
      context: .
      args:
        SERVICE_NAME: gateway
      cache_from:
        - bookswap-gateway:latest
    image: bookswap-gateway:latest
    container_name: bookswap-gateway
    ports:
      - "${GATEWAY_PORT:-8080}:${GATEWAY_PORT:-8080}"
    environment:
      SERVER_PORT: ${GATEWAY_PORT:-8080}
      EUREKA_URI: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      JWT_SECRET: your-256-bit-secret-key-change-this-in-production-please-make-it-long
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - bookswap-network

  auth-service:
    build:
      context: .
      args:
        SERVICE_NAME: auth-service
      cache_from:
        - bookswap-auth:latest
    image: bookswap-auth:latest
    container_name: bookswap-auth
    ports:
      - "${AUTH_SERVICE_PORT:-8081}:${AUTH_SERVICE_PORT:-8081}"
    environment:
      SERVER_PORT: ${AUTH_SERVICE_PORT:-8081}
      EUREKA_URI: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bookswap_auth
      DB_USER: bookswap
      DB_PASSWORD: bookswap
      JWT_SECRET: your-256-bit-secret-key-change-this-in-production-please-make-it-long
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - bookswap-network

  book-service:
    build:
      context: .
      args:
        SERVICE_NAME: book-service
      cache_from:
        - bookswap-books:latest
    image: bookswap-books:latest
    container_name: bookswap-books
    ports:
      - "${BOOK_SERVICE_PORT:-8082}:${BOOK_SERVICE_PORT:-8082}"
    environment:
      SERVER_PORT: ${BOOK_SERVICE_PORT:-8082}
      EUREKA_URI: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bookswap_books
      DB_USER: bookswap
      DB_PASSWORD: bookswap
      JWT_SECRET: your-256-bit-secret-key-change-this-in-production-please-make-it-long
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - bookswap-network

  exchange-service:
    build:
      context: .
      args:
        SERVICE_NAME: exchange-service
      cache_from:
        - bookswap-exchange:latest
    image: bookswap-exchange:latest
    container_name: bookswap-exchange
    ports:
      - "${EXCHANGE_SERVICE_PORT:-8083}:${EXCHANGE_SERVICE_PORT:-8083}"
    environment:
      SERVER_PORT: ${EXCHANGE_SERVICE_PORT:-8083}
      EUREKA_URI: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bookswap_exchanges
      DB_USER: bookswap
      DB_PASSWORD: bookswap
      JWT_SECRET: your-256-bit-secret-key-change-this-in-production-please-make-it-long
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      book-service:
        condition: service_started
    networks:
      - bookswap-network

  publication-service:
    build:
      context: .
      args:
        SERVICE_NAME: publication-service
      cache_from:
        - bookswap-publication:latest
    image: bookswap-publication:latest
    container_name: bookswap-publication
    ports:
      - "${PUBLICATION_SERVICE_PORT:-8084}:${PUBLICATION_SERVICE_PORT:-8084}"
    environment:
      SERVER_PORT: ${PUBLICATION_SERVICE_PORT:-8084}
      EUREKA_URI: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bookswap_publications
      DB_USER: bookswap
      DB_PASSWORD: bookswap
      JWT_SECRET: your-256-bit-secret-key-change-this-in-production-please-make-it-long
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      book-service:
        condition: service_started
    networks:
      - bookswap-network

  adminer:
    image: adminer:latest
    container_name: bookswap-adminer
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8081:8080"
    networks:
      - bookswap-network
    restart: unless-stopped

volumes:
  postgres-data:

networks:
  bookswap-network:
    driver: bridge
