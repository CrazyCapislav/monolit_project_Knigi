services:
  postgres:
    image: postgres:16-alpine
    container_name: bookswap-postgres
    environment:
      POSTGRES_USER: bookswap
      POSTGRES_PASSWORD: bookswap
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bookswap-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookswap"]
      interval: 5s
      timeout: 5s
      retries: 5

  eureka-server:
    build:
      context: .
      args:
        SERVICE_NAME: eureka-server
    container_name: bookswap-eureka
    ports:
      - "8761:8761"
    networks:
      - bookswap-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  config-server:
    build:
      context: .
      args:
        SERVICE_NAME: config-server
    container_name: bookswap-config
    ports:
      - "8888:8888"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: https://github.com/FreezinMoon/bookswap-config.git
      SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL: main
      SPRING_CLOUD_CONFIG_SERVER_GIT_CLONE_ON_START: "true"
      SPRING_CLOUD_CONFIG_SERVER_GIT_FORCE_PULL: "true"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - bookswap-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  gateway:
    build:
      context: .
      args:
        SERVICE_NAME: gateway
    container_name: bookswap-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      JWT_SECRET: your-256-bit-secret-key-change-this-in-production-please-make-it-long
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - bookswap-network

  auth-service:
    build:
      context: .
      args:
        SERVICE_NAME: auth-service
    container_name: bookswap-auth
    ports:
      - "8081:8081"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bookswap_auth
      DB_USER: bookswap
      DB_PASSWORD: bookswap
      JWT_SECRET: your-256-bit-secret-key-change-this-in-production-please-make-it-long
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - bookswap-network

  book-service:
    build:
      context: .
      args:
        SERVICE_NAME: book-service
    container_name: bookswap-books
    ports:
      - "8082:8082"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bookswap_books
      DB_USER: bookswap
      DB_PASSWORD: bookswap
      JWT_SECRET: your-256-bit-secret-key-change-this-in-production-please-make-it-long
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - bookswap-network

  exchange-service:
    build:
      context: .
      args:
        SERVICE_NAME: exchange-service
    container_name: bookswap-exchange
    ports:
      - "8083:8083"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bookswap_exchanges
      DB_USER: bookswap
      DB_PASSWORD: bookswap
      JWT_SECRET: your-256-bit-secret-key-change-this-in-production-please-make-it-long
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      book-service:
        condition: service_started
    networks:
      - bookswap-network

  publication-service:
    build:
      context: .
      args:
        SERVICE_NAME: publication-service
    container_name: bookswap-publication
    ports:
      - "8084:8084"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bookswap_publications
      DB_USER: bookswap
      DB_PASSWORD: bookswap
      JWT_SECRET: your-256-bit-secret-key-change-this-in-production-please-make-it-long
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      book-service:
        condition: service_started
    networks:
      - bookswap-network

volumes:
  postgres-data:

networks:
  bookswap-network:
    driver: bridge