services:
  postgres:
    image: postgres:16-alpine
    container_name: bookswap-postgres
    environment:
      POSTGRES_USER: bookswap
      POSTGRES_PASSWORD: bookswap
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bookswap-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookswap"]
      interval: 5s
      timeout: 5s
      retries: 5

  eureka-server:
    build:
      context: .
      args:
        SERVICE_NAME: eureka-server
    container_name: bookswap-eureka
    ports:
      - "8761:8761"
    networks:
      - bookswap-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  config-server:
    build:
      context: .
      args:
        SERVICE_NAME: config-server
    container_name: bookswap-config
    ports:
      - "8888:8888"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      SPRING_CLOUD_CONFIG_SERVER_GIT_URI: https://github.com/FreezinMoon/bookswap-config.git
      SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL: lab4-config
      SPRING_CLOUD_CONFIG_SERVER_GIT_CLONE_ON_START: "true"
      SPRING_CLOUD_CONFIG_SERVER_GIT_FORCE_PULL: "true"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - bookswap-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8888/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  gateway:
    build:
      context: .
      args:
        SERVICE_NAME: gateway
    container_name: bookswap-gateway
    ports:
      - "8080:8080"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      JWT_SECRET: your-256-bit-secret-key-change-this-in-production-please-make-it-long
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - bookswap-network

  auth-service:
    build:
      context: .
      args:
        SERVICE_NAME: auth-service
    container_name: bookswap-auth
    ports:
      - "8081:8081"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bookswap_auth
      DB_USER: bookswap
      DB_PASSWORD: bookswap
      JWT_SECRET: your-256-bit-secret-key-change-this-in-production-please-make-it-long
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - bookswap-network

  book-service:
    build:
      context: .
      args:
        SERVICE_NAME: book-service
    container_name: bookswap-books
    ports:
      - "8082:8082"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bookswap_books
      DB_USER: bookswap
      DB_PASSWORD: bookswap
      JWT_SECRET: your-256-bit-secret-key-change-this-in-production-please-make-it-long
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
    networks:
      - bookswap-network

  exchange-service:
    build:
      context: .
      args:
        SERVICE_NAME: exchange-service
    container_name: bookswap-exchange
    ports:
      - "8083:8083"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bookswap_exchanges
      DB_USER: bookswap
      DB_PASSWORD: bookswap
      JWT_SECRET: your-256-bit-secret-key-change-this-in-production-please-make-it-long
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      book-service:
        condition: service_started
    networks:
      - bookswap-network

  publication-service:
    build:
      context: .
      args:
        SERVICE_NAME: publication-service
    container_name: bookswap-publication
    ports:
      - "8084:8084"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bookswap_publications
      DB_USER: bookswap
      DB_PASSWORD: bookswap
      JWT_SECRET: your-256-bit-secret-key-change-this-in-production-please-make-it-long
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      book-service:
        condition: service_started
    networks:
      - bookswap-network

  notification-service:
    build:
      context: .
      args:
        SERVICE_NAME: notification-service
    container_name: bookswap-notifications
    ports:
      - "8085:8085"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bookswap_notifications
      DB_USER: bookswap
      DB_PASSWORD: bookswap
      JWT_SECRET: your-256-bit-secret-key-change-this-in-production-please-make-it-long
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      kafka-3:
        condition: service_started
    networks:
      - bookswap-network

  file-service:
    build:
      context: .
      args:
        SERVICE_NAME: file-service
    container_name: bookswap-files
    ports:
      - "8086:8086"
    environment:
      EUREKA_URI: http://eureka-server:8761/eureka/
      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: bookswap_files
      DB_USER: bookswap
      DB_PASSWORD: bookswap
      JWT_SECRET: your-256-bit-secret-key-change-this-in-production-please-make-it-long
    depends_on:
      postgres:
        condition: service_healthy
      eureka-server:
        condition: service_healthy
      config-server:
        condition: service_healthy
      kafka-1:
        condition: service_started
      kafka-2:
        condition: service_started
      kafka-3:
        condition: service_started
    volumes:
      - file-storage:/app/uploads
    networks:
      - bookswap-network

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: bookswap-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    networks:
      - bookswap-network
    volumes:
      - zookeeper-data:/var/lib/zookeeper/data
      - zookeeper-logs:/var/lib/zookeeper/log

  kafka-1:
    image: confluentinc/cp-kafka:7.5.0
    container_name: bookswap-kafka-1
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_IN_SYNC_REPLICAS: 2
    networks:
      - bookswap-network
    volumes:
      - kafka-1-data:/var/lib/kafka/data

  kafka-2:
    image: confluentinc/cp-kafka:7.5.0
    container_name: bookswap-kafka-2
    depends_on:
      - zookeeper
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 2
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:29092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_IN_SYNC_REPLICAS: 2
    networks:
      - bookswap-network
    volumes:
      - kafka-2-data:/var/lib/kafka/data

  kafka-3:
    image: confluentinc/cp-kafka:7.5.0
    container_name: bookswap-kafka-3
    depends_on:
      - zookeeper
    ports:
      - "9094:9094"
    environment:
      KAFKA_BROKER_ID: 3
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:29092,PLAINTEXT_HOST://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_IN_SYNC_REPLICAS: 2
    networks:
      - bookswap-network
    volumes:
      - kafka-3-data:/var/lib/kafka/data

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: bookswap-kafka-ui
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: bookswap-cluster
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka-1:29092,kafka-2:29092,kafka-3:29092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - bookswap-network

  kafka-init:
    image: confluentinc/cp-kafka:7.5.0
    container_name: bookswap-kafka-init
    depends_on:
      - kafka-1
      - kafka-2
      - kafka-3
    volumes:
      - ./kafka-init/init-topics.sh:/tmp/init-topics.sh
    command: "bash /tmp/init-topics.sh"
    networks:
      - bookswap-network
    restart: on-failure

volumes:
  postgres-data:
  zookeeper-data:
  zookeeper-logs:
  kafka-1-data:
  kafka-2-data:
  kafka-3-data:
  file-storage:

networks:
  bookswap-network:
    driver: bridge