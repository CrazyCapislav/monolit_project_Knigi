# Testcontainers configuration for Windows Docker Desktop
# Enable container reuse for faster test execution
testcontainers.reuse.enable=true

# Disable Ryuk container (can cause issues on Windows)
testcontainers.ryuk.container.image=testcontainers/ryuk:latest

# Docker connection - let testcontainers auto-detect
# For Windows, it should use named pipes by default
# If auto-detection fails, try setting one of these:
# docker.client.strategy=org.testcontainers.dockerclient.NpipeSocketClientProviderStrategy
# docker.client.strategy=org.testcontainers.dockerclient.EnvironmentAndSystemPropertyClientProviderStrategy

