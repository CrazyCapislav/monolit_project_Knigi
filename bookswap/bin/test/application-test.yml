spring:
  jackson:
    property-naming-strategy: SNAKE_CASE

  # Используем существующий контейнер из docker-compose, если он запущен
  # Или testcontainers создаст свой контейнер
  datasource:
    url: ${TEST_DB_URL:jdbc:postgresql://localhost:5432/books}
    username: ${TEST_DB_USER:books}
    password: ${TEST_DB_PASSWORD:books}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration
