version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: bookswap-postgres
    environment:
      POSTGRES_USER: bookswap
      POSTGRES_PASSWORD: bookswap
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./init-databases.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - bookswap-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookswap"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres-data:

networks:
  bookswap-network:
    driver: bridge
