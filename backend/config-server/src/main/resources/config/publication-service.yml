server:
  port: 8084

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bookswap_publications}
    username: ${DB_USER:bookswap}
    password: ${DB_PASSWORD:bookswap}
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  
  flyway:
    enabled: true
    locations: classpath:db/migration

jwt:
  secret: your-256-bit-secret-key-change-this-in-production-please-make-it-long

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000