spring:
  application:
    name: exchange-service
  config:
    import: optional:configserver:${SPRING_CONFIG_IMPORT:http://localhost:8888}
# Вся конфигурация вынесена в Config Server (exchange-service.yml)

# Circuit Breaker configuration for Resilience4j
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowSize: 10
        minimumNumberOfCalls: 1
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 5s
        failureRateThreshold: 50
        slowCallRateThreshold: 100
        slowCallDurationThreshold: 2s
    instances:
      bookService:
        baseConfig: default
        slidingWindowSize: 10
        minimumNumberOfCalls: 1
        waitDurationInOpenState: 5s
        failureRateThreshold: 50

# Feign configuration with Circuit Breaker
feign:
  circuitbreaker:
    enabled: true
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 5000
      book-service:
        connectTimeout: 2000
        readTimeout: 2000