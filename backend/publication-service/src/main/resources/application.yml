spring:
  application:
    name: publication-service
  config:
    import: optional:configserver:${SPRING_CONFIG_IMPORT:http://localhost:8888}
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:bookswap_publications}
    username: ${DB_USER:bookswap}
    password: ${DB_PASSWORD:bookswap}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

server:
  port: 8084

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-this-in-production-please-make-it-long}

logging:
  level:
    root: INFO
    dev.petr: DEBUG
    dev.petr.publication.client: DEBUG